name = "milematch"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Set this to your Pages origin before you share the app. With "*" anyone can
# point their own site at this worker and spend your monthly search allowance.
#
# The worker enforces this server-side (rejects mismatched Origins with 403),
# not just via CORS headers - CORS alone is only honoured by browsers. It still
# cannot make a public endpoint private; it stops other SITES using it.
#
# Comma-separated for multiple origins. Use "*" only while developing.
ALLOWED_ORIGIN = "https://brandonskar.github.io"

# How long an identical search is reused before spending another SerpApi call.
# The free tier is 250 searches/month shared by every visitor, so this is the
# difference between the allowance lasting a month and lasting an afternoon.
# Fares do move, so this is a trade-off rather than a free win.
CACHE_HOURS = "6"

# Secrets are NOT set here. Run once after obtaining a key:
#   npx wrangler secret put SERPAPI_KEYS
#
# The value is one key, or several comma-separated:  key1,key2,key3
# They are tried in order, and the next is used when one runs out of searches.
# Each free account gets its own 250/month, so three keys is three allowances.
#
# SERPAPI_KEY (singular) is still honoured and tried last, so a worker set up
# before rotation existed keeps working without being touched.
#
# Free key: https://serpapi.com/users/sign_up
